# Sanuvia Engineering Review Harness — nginx reverse proxy.
#
# This host already runs nginx, so we front the app with nginx (not Caddy) to
# avoid a port 80/443 conflict. The app stays on 127.0.0.1:8000; nginx
# terminates HTTPS for buyafraction.com and forwards to it.
#
# Install:
#   sudo cp /opt/sanuvia/deploy/nginx/buyafraction.com.conf \
#           /etc/nginx/sites-available/buyafraction.com.conf
#   sudo ln -sf /etc/nginx/sites-available/buyafraction.com.conf \
#               /etc/nginx/sites-enabled/buyafraction.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: obtain a certificate with certbot (fills in the ssl_* lines below):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d buyafraction.com
# certbot edits this server block in place and sets up auto-renewal.

upstream sanuvia_harness {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- HTTP: allow ACME challenges, redirect everything else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name buyafraction.com;

    # Let certbot serve the HTTP-01 challenge from the default webroot.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS: terminate TLS and reverse-proxy to the local app -----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name buyafraction.com;

    # certbot populates these (or point them at your own cert/key).
    ssl_certificate     /etc/letsencrypt/live/buyafraction.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buyafraction.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Uploads/exports (e.g. review package) are modest; keep a sane cap.
    client_max_body_size 16m;

    # Access/error logs (nginx' logrotate handles rotation on Ubuntu).
    access_log /var/log/nginx/buyafraction.access.log;
    error_log  /var/log/nginx/buyafraction.error.log;

    # --- Dynamic engine output: never cache -----------------------------------
    location ~ ^/(api|health) {
        proxy_pass http://sanuvia_harness;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        add_header Cache-Control "no-store" always;
    }

    # --- Static assets: cache efficiently (inline today; future-proof) --------
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?|map)$ {
        proxy_pass http://sanuvia_harness;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Application shell -----------------------------------------------------
    location / {
        proxy_pass http://sanuvia_harness;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }
}
