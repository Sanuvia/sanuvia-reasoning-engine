# Sanuvia Engineering Review Harness — nginx reverse proxy.
#
# This host already runs nginx, so we front the app with nginx (not Caddy) to
# avoid a port 80/443 conflict. The app stays on 127.0.0.1:8000; nginx proxies
# to it and (after certbot) terminates HTTPS for buyafraction.com.
#
# This file is intentionally HTTP-only so `nginx -t` passes immediately (no
# reference to certificates that don't exist yet). Run certbot with the nginx
# plugin and it rewrites THIS server block in place — adding `listen 443 ssl`,
# the certificate lines, and an 80 -> 443 redirect — while keeping the proxy
# rules below. That avoids the classic "cert referenced before it exists" and
# "unknown directive http2" (nginx < 1.25) failures.
#
# Install:
#   sudo cp /opt/sanuvia/deploy/nginx/buyafraction.com.conf \
#           /etc/nginx/sites-available/buyafraction.com.conf
#   sudo ln -sf /etc/nginx/sites-available/buyafraction.com.conf \
#               /etc/nginx/sites-enabled/buyafraction.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain TLS (edits this block + sets up auto-renewal):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d buyafraction.com
#
# certbot's HTTP-01 challenge needs buyafraction.com to resolve publicly with
# port 80 reachable. If this host is private/unreachable, see
# docs/deployment.md -> Troubleshooting -> TLS (DNS-01 or self-signed).

upstream sanuvia_harness {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name buyafraction.com;

    # Exports (e.g. the review package) are modest; keep a sane cap.
    client_max_body_size 16m;

    access_log /var/log/nginx/buyafraction.access.log;
    error_log  /var/log/nginx/buyafraction.error.log;

    # Let certbot's HTTP-01 challenge be served from the default webroot
    # (harmless with the nginx plugin; useful for webroot/renewal setups).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Dynamic engine output: never cache -----------------------------------
    location ~ ^/(api|health) {
        proxy_pass http://sanuvia_harness;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        add_header Cache-Control "no-store" always;
    }

    # --- Static assets: cache efficiently (inline today; future-proof) --------
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|woff2?|map)$ {
        proxy_pass http://sanuvia_harness;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- Application shell -----------------------------------------------------
    location / {
        proxy_pass http://sanuvia_harness;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }
}
