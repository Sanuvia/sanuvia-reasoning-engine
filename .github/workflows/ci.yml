name: CI

# Continuous verification for the Sanuvia Reasoning Engine (Phase 0).
# Runs from a clean checkout — no dependency on developer-local state.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package requires Python >= 3.11; test the floor and a current line.
        python-version: ["3.11", "3.12"]
    env:
      # Determinism: pin the hash seed so rendered artifacts are byte-identical.
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout (clean)
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev tooling)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 1. Full test suite (includes isolation, reset/rerun, migration, smoke).
      - name: Full test suite
        run: python -m pytest -q

      # 2. Strict type checking.
      - name: mypy --strict
        run: python -m mypy

      # 3. Phase 0 synthetic exit test — the authoritative acceptance proof.
      - name: Phase 0 exit test
        run: python -m sanuvia.exit_test

      # 4. Subject / space isolation regression tests (Finding 1).
      - name: Subject/space isolation
        run: python -m pytest -q tests/test_space_isolation.py tests/adapters/test_sqlite_migration.py

      # 5. SQLite reset / rerun regression test (Finding 2).
      - name: SQLite reset/rerun
        run: python -m pytest -q tests/adapters/test_sqlite_reset_rerun.py

      # 6. Clean-host deployment smoke test (Finding 3).
      - name: Deployment smoke (python)
        run: python -m pytest -q tests/test_clean_host_smoke.py

      - name: Deployment smoke (shell, end-to-end)
        run: bash scripts/smoke.sh

  # Phase 1 (Controlled Reasoning Demonstrator) — additive, consumes the frozen
  # Phase 0 package via its public API. No network: the real model adapters are
  # injected/offline in tests, so nothing here reaches a provider.
  phase1:
    name: phase1 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout (clean)
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Phase 1 imports the frozen Phase 0 package; install it (editable) plus the
      # shared dev tooling (pytest + mypy) once from the repo root.
      - name: Install Phase 0 (editable) + dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 1. Phase 1 test suite (includes deterministic replay + import isolation).
      - name: Phase 1 tests
        working-directory: "sanuvia-phase1"
        run: python -m pytest -q

      # 2. Phase 1 strict type checking.
      - name: Phase 1 mypy --strict
        working-directory: "sanuvia-phase1"
        run: python -m mypy src tests fixtures

      # 3. Call out the determinism + isolation guarantees explicitly.
      - name: Phase 1 deterministic replay + import isolation
        working-directory: "sanuvia-phase1"
        run: |
          python -m pytest -q \
            tests/phase1/test_demonstrator_replay.py \
            tests/phase1/test_case_001_transcript_equivalence.py
